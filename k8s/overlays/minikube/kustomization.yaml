apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - secret.yaml
configMapGenerator:
  - name: app-config
    namespace: hitcounter
    behavior: merge
    literals:
      - APP_ENV=minikube
patches:
  - target:
      kind: Service
      name: api
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
