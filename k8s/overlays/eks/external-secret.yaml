apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: hitcounter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: app-secret
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: hitcounter/prod/redis
        property: password
