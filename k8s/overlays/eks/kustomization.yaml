apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secret.yaml
  - pdb.yaml
configMapGenerator:
  - name: app-config
    namespace: hitcounter
    behavior: merge
    literals:
      - APP_ENV=production
images:
  - name: hitcounter-api
    newName: registry.example.com/hitcounter-api
    newTag: 1.0.3
replicas:
  - name: api
    count: 3
patches:
  - path: ingress-alb.yaml
  - path: api-spread.yaml
  - path: redis-storage.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
